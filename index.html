<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Esubalew | Telegram</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #229ED9, #0b6fa4);
            color: white;
            text-align: center;
        }

        .container {
            max-width: 420px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            color: #333;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .profile {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 {
            margin: 10px 0;
            color: #229ED9;
        }

        .username {
            color: #777;
            margin-bottom: 25px;
        }

        p {
            line-height: 1.6;
        }

        .telegram-button {
            display: block;
            margin-top: 25px;
            padding: 15px;
            background: #229ED9;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .telegram-button:hover {
            background: #168ac0;
        }

        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Profile picture -->
        <img src="profile.jpg" class="profile" alt="Esubalew">

        <h1>Esubalew</h1>

        <div class="username">
            @esu_2723
        </div>

        <p>
            Welcome to my personal Telegram page.
        </p>

        <p>
            You can contact me directly through Telegram.
        </p>

        <a class="telegram-button"
           href="https://t.me/esu_2723"
           target="_blank">
            ✈️ Open My Telegram
        </a>

        <footer>
            © 2026 Esubalew
        </footer>

    </div>

</body>
</html>
